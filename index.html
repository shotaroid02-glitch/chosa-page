<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="調査">
<meta name="theme-color" content="#1F5FA8">
<meta name="robots" content="noindex,nofollow">
<title>調査</title>
<style>
html,body{margin:0;height:100%;background:#F3F5F8;font:16px -apple-system,"Hiragino Sans",sans-serif;color:#555}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block}
#msg{padding:24px;line-height:1.7}
#msg a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:#1F5FA8;color:#fff;text-decoration:none;font-weight:700}
#help{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:14px;text-align:center}
#help a{color:#1F5FA8;font-weight:700}
</style></head>
<body>
<div id="msg">開いています…</div>
<script>
// 枠だけのページ。中身（調査のページ）は Google のウェブアプリ。ウェブアプリの番号はこのページに書かず、
// 案件フォルダのリンクの # のうしろで渡す（# のうしろはサーバーに送られない）。
// 直接開くと上に出る Google の帯は、枠の中に入れると出ない。
// ただし iPad の Safari などは枠の中の Google のページを止めて空白になることがある（2026-11-07）。
// 中のページが「開けた」と知らせてこなければ、ウェブアプリを直接開き直す（帯は出るが使える）。その端末は次から直接開く。
(function(){
  var h = new URLSearchParams(location.hash.slice(1));
  var d = (h.get('d') || '').replace(/[^0-9A-Za-z_-]/g, '');
  var no = (h.get('no') || '').replace(/[^0-9A-Za-z_-]/g, '');
  try { if (d) localStorage.setItem('chosa-d', d); else d = localStorage.getItem('chosa-d') || ''; } catch(e) {}
  var msg = document.getElementById('msg');
  if (!d) { msg.textContent = '案件フォルダの「調査のページを開く」から開いてください。'; return; }
  var url = 'https://script.google.com/macros/s/' + d + '/exec' + (no ? '?no=' + encodeURIComponent(no) : '');
  var direct = false;
  try { direct = localStorage.getItem('chosa-direct') === '1'; } catch(e) {}
  if (direct) { location.replace(url); return; }
  var ready = false;
  window.addEventListener('message', function(ev){
    if (ev && ev.data && ev.data.chosa === 'ready') { ready = true; var hp = document.getElementById('help'); if (hp) hp.remove(); }
  });
  var f = document.createElement('iframe');
  f.src = url;
  f.allow = 'camera; geolocation; clipboard-write';
  document.body.appendChild(f);
  var hp = document.createElement('div'); hp.id = 'help';
  hp.innerHTML = '表示されないときは <a href="' + url + '">こちらから直接開く</a>';
  hp.querySelector('a').addEventListener('click', function(){ try { localStorage.setItem('chosa-direct', '1'); } catch(e) {} });
  setTimeout(function(){ if (!ready) document.body.appendChild(hp); }, 4000);
  setTimeout(function(){
    if (ready) return;
    try { localStorage.setItem('chosa-direct', '1'); } catch(e) {}
    location.replace(url);
  }, 12000);
})();
</script>
</body></html>
