<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="調査">
<meta name="theme-color" content="#1F5FA8">
<meta name="robots" content="noindex,nofollow">
<title>調査</title>
<style>
html,body{margin:0;height:100%;background:#F3F5F8;font:16px -apple-system,"Hiragino Sans",sans-serif;color:#555}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block}
#msg{padding:24px}
</style></head>
<body>
<div id="msg">開いています…</div>
<script>
// 枠だけのページ。中身（調査のページ）は Google のウェブアプリ。ウェブアプリの番号はこのページに書かず、
// 案件フォルダのリンクの # のうしろで渡す（# のうしろはサーバーに送られない）。
// 直接開くと上に出る Google の帯は、枠の中に入れると出ない。
(function(){
  var h = new URLSearchParams(location.hash.slice(1));
  var d = (h.get('d') || '').replace(/[^0-9A-Za-z_-]/g, '');
  var no = (h.get('no') || '').replace(/[^0-9A-Za-z_-]/g, '');
  try { if (d) localStorage.setItem('chosa-d', d); else d = localStorage.getItem('chosa-d') || ''; } catch(e) {}
  if (!d) { document.getElementById('msg').textContent = '案件フォルダの「調査のページを開く」から開いてください。'; return; }
  var f = document.createElement('iframe');
  f.src = 'https://script.google.com/macros/s/' + d + '/exec' + (no ? '?no=' + encodeURIComponent(no) : '');
  f.allow = 'camera; geolocation; clipboard-write';
  f.onload = function(){ var m = document.getElementById('msg'); if (m) m.remove(); };
  document.body.appendChild(f);
})();
</script>
</body></html>
